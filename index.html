<title>HFO1 希望シフト入力</title>
<style>
:root {
  --primary:      #2E7D7A;
  --primary-dark: #1F5957;
  --bg-dark:      #0F2A47;
  --bg-darker:    #081A2E;
  --accent:       #F4A261;
  --accent-glow:  rgba(244, 162, 97, 0.4);
  --teal-glow:    rgba(46, 125, 122, 0.5);
  --text:         #FFFFFF;
  --text-muted:   rgba(255,255,255,0.65);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%;
  background: #000;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  -webkit-text-size-adjust: 100%;
  transition: background 1.2s ease;
}
html.bg-ready, body.bg-ready { background: var(--bg-dark); }
body { overflow-x: hidden; }

/* ===== 背景グリッド ===== */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(46,125,122,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,125,122,0.06) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s ease 0.5s;
}
body.bg-ready .bg-grid { opacity: 1; }

/* ===== グローオーブ ===== */
.glow-orb {
  position: fixed; border-radius: 50%; filter: blur(80px);
  opacity: 0; z-index: 0; pointer-events: none;
  transition: opacity 1s ease 1s;
}
.glow-orb.a {
  width: 400px; height: 400px;
  background: var(--primary);
  top: -100px; left: -100px;
  animation: float-a 8s ease-in-out infinite;
}
.glow-orb.b {
  width: 350px; height: 350px;
  background: var(--accent);
  bottom: -100px; right: -100px;
  animation: float-b 10s ease-in-out infinite;
}
body.bg-ready .glow-orb.a { opacity: 0.5; }
body.bg-ready .glow-orb.b { opacity: 0.3; }
@keyframes float-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(60px, 50px) scale(1.1); }
}
@keyframes float-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-50px, -40px) scale(1.15); }
}

/* ===== コンテナ ===== */
.container {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 24px 60px;
  text-align: center;
  gap: 1.2rem;
}

/* ===== ロゴカード ===== */
.logo-wrap {
  width: min(80vw, 320px);
  height: min(80vw, 320px);
  background: transparent;
  border-radius: 32px;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  box-shadow: none;
  opacity: 0;
}
.logo-wrap.bg-ready {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    0 0 80px var(--teal-glow),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
.logo-wrap.bg-ready::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.15), transparent 50%);
  pointer-events: none;
}
.logo-wrap.bg-ready::after {
  content: '';
  position: absolute; top: -50%; left: -60%;
  width: 40%; height: 200%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: skewX(-20deg); opacity: 0;
  animation: logoShimmer 4s ease-in-out 7s infinite;
}
@keyframes logoShimmer {
  0%{left:-60%;opacity:0}
  10%{opacity:1}
  35%{left:120%;opacity:1}
  40%{opacity:0}
  100%{left:120%;opacity:0}
}

.dot-canvas { position: absolute; z-index: 2; pointer-events: none; }

.logo-img {
  position: absolute;
  width: 85%; height: auto;
  z-index: 1;
  visibility: hidden;
}

/* ===== タイトル ===== */
.title {
  font-size: clamp(1.4rem, 5vw, 1.9rem);
  font-weight: 800;
  letter-spacing: 0.05em;
  opacity: 0; transform: translateY(20px);
}
.title.show { animation: fadeUp 0.7s ease forwards; }
.title span { color: var(--accent); font-weight: 900; }

.subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
  opacity: 0; transform: translateY(20px);
}
.subtitle.show { animation: fadeUp 0.7s ease 0.2s forwards; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* ===== ボタン ===== */
.btn-area {
  margin-top: 0.6rem;
  opacity: 0; transform: translateY(20px);
}
.btn-area.show { animation: fadeUp 0.7s ease 0.4s forwards; }
.btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 16px 36px;
  border-radius: 999px;
  font-size: 1.05rem;
  font-weight: 700;
  text-decoration: none;
  box-shadow:
    0 10px 30px var(--teal-glow),
    0 0 0 1px rgba(255,255,255,0.1) inset;
  position: relative; overflow: hidden;
  transition: transform 0.15s;
  animation: btnPulse 2.5s ease-in-out 7s infinite;
}
.btn:active { transform: scale(0.96); }
.btn::before {
  content: ''; position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.6s;
}
.btn:hover::before { left: 100%; }
.btn::after {
  content: ''; position: absolute;
  top: -50%; left: -60%;
  width: 40%; height: 200%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transform: skewX(-20deg);
  animation: shimmer 3s ease-in-out 7s infinite;
}
@keyframes shimmer { 0%{left:-60%} 30%{left:120%} 100%{left:120%} }
@keyframes btnPulse {
  0%,100% { box-shadow: 0 10px 30px var(--teal-glow), 0 0 0 0 var(--teal-glow); }
  50%     { box-shadow: 0 10px 40px var(--teal-glow), 0 0 0 8px rgba(46,125,122,0.08); }
}
.btn-icon { font-size: 1.3em; }

/* ===== スクロールヒント ===== */
.scroll-hint {
  margin-top: 20px;
  font-size: 0.8rem;
  color: var(--text-muted);
  opacity: 0;
  cursor: pointer;
}
.scroll-hint.show {
  animation: hint-pulse 2s 1s infinite;
}
.scroll-hint .arrow {
  display: block;
  font-size: 1.4rem;
  margin-top: 4px;
  animation: bounce 1.8s ease-in-out infinite;
}
@keyframes hint-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* ===== QRコードセクション ===== */
.qr-section {
  position: relative; z-index: 1;
  padding: 60px 24px 40px;
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
  opacity: 0;
  transition: opacity 0.8s ease;
}
body.bg-ready .qr-section { opacity: 1; }

.qr-section h2 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
  letter-spacing: 0.05em;
}
.qr-section h2 .ico { margin-right: 8px; }
.qr-section .qr-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 24px;
  max-width: 320px;
  line-height: 1.6;
}
.qr-card {
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 60px var(--teal-glow);
  margin-bottom: 20px;
}
#qrCanvas { display: block; border-radius: 8px; }
.qr-url-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 12px 16px;
  margin-top: 8px;
  max-width: 90vw;
  word-break: break-all;
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: -apple-system, "SF Mono", Menlo, monospace;
}
.copy-btn {
  margin-top: 14px;
  background: rgba(255,255,255,0.1);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 20px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center; gap: 8px;
}
.copy-btn:hover { background: rgba(255,255,255,0.15); }
.copy-btn:active { transform: scale(0.95); }
.copy-btn.copied {
  background: var(--primary);
  border-color: var(--primary);
}

/* ===== フッター ===== */
.footer {
  width: 100%;
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  padding: 24px 0;
}
.footer .ver {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  font-size: 0.65rem;
}

/* ===== iOSセーフエリア ===== */
@supports (padding: env(safe-area-inset-bottom)) {
  .footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
}

/* ===== タブレット ===== */
@media (min-width: 768px) {
  .logo-wrap { width: min(50vw, 360px); height: min(50vw, 360px); }
  .title { font-size: 2rem; }
  .subtitle { font-size: 1.05rem; }
  .btn { padding: 18px 44px; font-size: 1.15rem; }
}
@media (orientation:landscape) and (max-height:500px){
  .container{ gap:.6rem; padding:1rem; }
  .logo-wrap{ width:min(50vw,240px); height:min(50vw,240px); }
  .title{ font-size:1.1rem; }
  .btn{ padding:.7rem 1.5rem; font-size:1rem; }
}
</style>
</head>

  var ACCENT_COLOR_R = 244, ACCENT_COLOR_G = 162, ACCENT_COLOR_B = 97; // オレンジ
  
  function sparkRGBA(alpha) {
    return 'rgba(' + SPARK_COLOR_R + ',' + SPARK_COLOR_G + ',' + SPARK_COLOR_B + ',' + alpha + ')';
  }
  function accentRGBA(alpha) {
    return 'rgba(' + ACCENT_COLOR_R + ',' + ACCENT_COLOR_G + ',' + ACCENT_COLOR_B + ',' + alpha + ')';
  }

  setTimeout(function(){
    var wrapRect = wrap.getBoundingClientRect();
    var rL = wrapRect.left, rT = wrapRect.top, rW = wrapRect.width, rH = wrapRect.height;
    var bR = 32;  // ロゴカードの角丸（CSS .logo-wrap.bg-ready の border-radius 32px に合わせる）
    startIntro(rL, rT, rW, rH, bR);
  }, 100);

  function startIntro(rL, rT, rW, rH, bR){

    function roundedRectPoints(x, y, w, h, r, count){
      var pts = [];
      var segs = [];
      segs.push({type:'line', x1:x+r, y1:y, x2:x+w-r, y2:y});
      segs.push({type:'arc', cx:x+w-r, cy:y+r, r:r, a1:-Math.PI/2, a2:0});
      segs.push({type:'line', x1:x+w, y1:y+r, x2:x+w, y2:y+h-r});
      segs.push({type:'arc', cx:x+w-r, cy:y+h-r, r:r, a1:0, a2:Math.PI/2});
      segs.push({type:'line', x1:x+w-r, y1:y+h, x2:x+r, y2:y+h});
      segs.push({type:'arc', cx:x+r, cy:y+h-r, r:r, a1:Math.PI/2, a2:Math.PI});
      segs.push({type:'line', x1:x, y1:y+h-r, x2:x, y2:y+r});
      segs.push({type:'arc', cx:x+r, cy:y+r, r:r, a1:Math.PI, a2:Math.PI*1.5});

      var lengths = segs.map(function(s){
        if(s.type==='line') return Math.hypot(s.x2-s.x1, s.y2-s.y1);
        return Math.abs(s.a2-s.a1)*s.r;
      });
      var total = lengths.reduce(function(a,b){return a+b;},0);

      for(var i=0;i<count;i++){
        var d = (i/count)*total;
        var acc=0;
        for(var j=0;j<segs.length;j++){
          if(acc+lengths[j]>=d){
            var t=(d-acc)/lengths[j];
            var s=segs[j];
            if(s.type==='line'){
              pts.push({x:s.x1+(s.x2-s.x1)*t, y:s.y1+(s.y2-s.y1)*t});
            } else {
              var a=s.a1+(s.a2-s.a1)*t;
              pts.push({x:s.cx+Math.cos(a)*s.r, y:s.cy+Math.sin(a)*s.r});
            }
            break;
          }
          acc+=lengths[j];
        }
      }
      return pts;
    }

    var sparkDur = 6000;
    var introHold = 700;
    var introReveal = 2000;
    var introStart = null;
    var introPhase = 'spark';

    function easeOutQuart(t){ return 1 - Math.pow(1-t, 4); }

    var perimPts = roundedRectPoints(rL, rT, rW, rH, bR, 1000);
    var sparkCount = 2000;
    var sparkParticles = [];
    for(var i = 0; i < sparkCount; i++){
      var angle = Math.random() * Math.PI * 2;
      var dist = 50 + Math.pow(Math.random(), 0.5) * Math.max(vw, vh) * 0.7;
      var borderIdx = Math.floor((i / sparkCount) * perimPts.length);
      var bp = perimPts[borderIdx];
      sparkParticles.push({
        angle: angle, dist: dist,
        scatterX: vw/2 + Math.cos(angle) * dist,
        scatterY: vh/2 + Math.sin(angle) * dist,
        borderX: bp.x, borderY: bp.y,
        size: 0.5 + Math.random() * 0.7,
        // 一部のパーティクルをオレンジにする
        isAccent: Math.random() < 0.15
      });
    }

    function introAnimate(ts){
      if(!introStart) introStart = ts;
      var el = ts - introStart;

      if(introPhase === 'spark'){
        var t = el / sparkDur;
        if(t > 1) t = 1;

        ictx.clearRect(0,0,vw,vh);
        ictx.fillStyle = '#000000';
        ictx.fillRect(0,0,vw,vh);

        if(t < 0.2){
          // Phase A: 中央に光が誕生（ティール+オレンジハロー）
          var p = t / 0.2;
          var ease = easeOutQuart(p);
          var dotSize = 1 + ease * 5;
          
          ictx.save();
          ictx.shadowColor = accentRGBA(ease * 0.6);
          ictx.shadowBlur = 30 + ease * 40;
          ictx.beginPath();
          ictx.arc(vw/2, vh/2, dotSize * 1.4, 0, Math.PI*2);
          ictx.fillStyle = accentRGBA(0.3 + ease * 0.3);
          ictx.fill();
          ictx.restore();
          
          ictx.save();
          ictx.shadowColor = sparkRGBA(ease * 0.9);
          ictx.shadowBlur = 10 + ease * 30;
          ictx.beginPath();
          ictx.arc(vw/2, vh/2, dotSize, 0, Math.PI*2);
          ictx.fillStyle = sparkRGBA(0.6 + ease * 0.4);
          ictx.fill();
          var pulse = Math.sin(p * Math.PI * 3) * 0.3;
          ictx.shadowBlur = 20 + pulse * 20;
          ictx.beginPath();
          ictx.arc(vw/2, vh/2, dotSize * 0.6, 0, Math.PI*2);
          ictx.fillStyle = sparkRGBA(0.4 + pulse);
          ictx.fill();
          ictx.restore();

        } else if(t < 0.5){
          // Phase B: 爆発拡散
          var p = (t - 0.2) / 0.3;
          var ease = easeOutQuart(p);

          for(var i = 0; i < sparkParticles.length; i++){
            var sp = sparkParticles[i];
            var cx = vw/2 + (sp.scatterX - vw/2) * ease;
            var cy = vh/2 + (sp.scatterY - vh/2) * ease;
            var alpha = Math.max(0.2, 1 - p * 0.5);

            // トレイル
            if(p < 0.7){
              var tp = ease * 0.6;
              var tx = vw/2 + (sp.scatterX - vw/2) * tp;
              var ty = vh/2 + (sp.scatterY - vh/2) * tp;
              ictx.beginPath();
              ictx.arc(tx, ty, sp.size * 0.4, 0, Math.PI*2);
              ictx.fillStyle = sp.isAccent ? accentRGBA(alpha * 0.2) : sparkRGBA(alpha * 0.2);
              ictx.fill();
            }

            ictx.beginPath();
            ictx.arc(cx, cy, sp.size, 0, Math.PI*2);
            ictx.fillStyle = sp.isAccent ? accentRGBA(alpha) : sparkRGBA(alpha);
            ictx.fill();
          }

          // 中央フラッシュ
          if(p < 0.3){
            var flashAlpha = (1 - p / 0.3) * 0.6;
            ictx.save();
            ictx.shadowColor = sparkRGBA(flashAlpha);
            ictx.shadowBlur = 40;
            ictx.beginPath();
            ictx.arc(vw/2, vh/2, 3 * (1 - p/0.3), 0, Math.PI*2);
            ictx.fillStyle = sparkRGBA(flashAlpha);
            ictx.fill();
            ictx.restore();
          }

        } else {
          // Phase C: 集結
          var p = (t - 0.5) / 0.5;
          var rectCx = rL + rW / 2;
          var rectCy = rT + rH / 2;

          if(p < 0.3){
            // C-1: 右回転で中央に収束
            var pp = p / 0.3;
            var ease = easeOutQuart(pp);
            var circleRadius = Math.min(rW, rH) * 0.03;

            for(var i = 0; i < sparkParticles.length; i++){
              var sp = sparkParticles[i];
              var dx = sp.scatterX - rectCx;
              var dy = sp.scatterY - rectCy;
              var dist = Math.sqrt(dx*dx + dy*dy);
              var angle = Math.atan2(dy, dx);
              var twistAngle = angle + ease * Math.PI * 0.8;
              var circleAngle = Math.random() * Math.PI * 2;
              var targetDist = Math.pow(Math.random(), 0.3) * circleRadius;
              var targetX = rectCx + Math.cos(circleAngle) * targetDist;
              var targetY = rectCy + Math.sin(circleAngle) * targetDist;
              var spinX = rectCx + Math.cos(twistAngle) * dist * (1 - ease * 0.7);
              var spinY = rectCy + Math.sin(twistAngle) * dist * (1 - ease * 0.7);
              var cx = spinX + (targetX - spinX) * ease;
              var cy = spinY + (targetY - spinY) * ease;

              ictx.beginPath();
              ictx.arc(cx, cy, sp.size, 0, Math.PI*2);
              ictx.fillStyle = sp.isAccent ? accentRGBA(0.8) : sparkRGBA(0.8);
              ictx.fill();
            }

          } else if(p < 0.42){
            // C-2: 再散開
            var pp = (p - 0.3) / 0.12;
            var ease = easeOutQuart(pp);
            var circleRadius = Math.min(rW, rH) * 0.03;

            for(var i = 0; i < sparkParticles.length; i++){
              var sp = sparkParticles[i];
              var circleAngle = (i / sparkParticles.length) * Math.PI * 2;
              var circDist = Math.pow(Math.random(), 0.3) * circleRadius;
              var circX = rectCx + Math.cos(circleAngle) * circDist;
              var circY = rectCy + Math.sin(circleAngle) * circDist;
              var scatterDist = circleRadius + ease * Math.max(vw, vh) * 0.25;
              sp._reX = rectCx + Math.cos(circleAngle) * scatterDist;
              sp._reY = rectCy + Math.sin(circleAngle) * scatterDist;
              var cx = circX + (sp._reX - circX) * ease;
              var cy = circY + (sp._reY - circY) * ease;

              ictx.beginPath();
              ictx.arc(cx, cy, sp.size, 0, Math.PI*2);
              ictx.fillStyle = sp.isAccent ? accentRGBA(0.6) : sparkRGBA(0.6);
              ictx.fill();
            }

          } else {
            // C-3: 左回転しながらロゴ枠の縁に集結
            var pp = (p - 0.42) / 0.58;
            var leftRotations = 3;
            var rotAngle = -pp * Math.PI * 2 * leftRotations;
            var settle = pp * pp;

            for(var i = 0; i < sparkParticles.length; i++){
              var sp = sparkParticles[i];
              var reX = sp._reX || sp.scatterX;
              var reY = sp._reY || sp.scatterY;

              var bdx = sp.borderX - rectCx;
              var bdy = sp.borderY - rectCy;
              var rotBX = rectCx + bdx * Math.cos(rotAngle) - bdy * Math.sin(rotAngle);
              var rotBY = rectCy + bdx * Math.sin(rotAngle) + bdy * Math.cos(rotAngle);

              var rdx = reX - rectCx;
              var rdy = reY - rectCy;
              var rotRX = rectCx + rdx * Math.cos(rotAngle) - rdy * Math.sin(rotAngle);
              var rotRY = rectCy + rdx * Math.sin(rotAngle) + rdy * Math.cos(rotAngle);

              var cx = rotRX + (rotBX - rotRX) * settle;
              var cy = rotRY + (rotBY - rotRY) * settle;
              var alpha = 0.5 + settle * 0.5;

              ictx.beginPath();
              ictx.arc(cx, cy, sp.size, 0, Math.PI*2);
              ictx.fillStyle = sp.isAccent ? accentRGBA(alpha) : sparkRGBA(alpha);
              ictx.fill();
            }
          }
        }

        if(t >= 1){
          introPhase = 'hold';
          introStart = ts;
        }
        requestAnimationFrame(introAnimate);

      } else if(introPhase === 'hold'){
        if(el > introHold){
          introPhase = 'reveal';
          introStart = ts;
        }
        requestAnimationFrame(introAnimate);

      } else if(introPhase === 'reveal'){
        // 黒画面 → ネイビー背景 への遷移 + ロゴカードは保持
        var t = el / introReveal;
        if(t > 1) t = 1;

        ictx.clearRect(0,0,vw,vh);

        // ネイビー背景を表示
        ictx.fillStyle = '#0F2A47';
        ictx.fillRect(0, 0, vw, vh);

        // ロゴカード位置（ティールグラデーション風: ベース色を塗る）
        ictx.beginPath();
        ictx.moveTo(rL + bR, rT);
        ictx.lineTo(rL + rW - bR, rT);
        ictx.arcTo(rL + rW, rT, rL + rW, rT + bR, bR);
        ictx.lineTo(rL + rW, rT + rH - bR);
        ictx.arcTo(rL + rW, rT + rH, rL + rW - bR, rT + rH, bR);
        ictx.lineTo(rL + bR, rT + rH);
        ictx.arcTo(rL, rT + rH, rL, rT + rH - bR, bR);
        ictx.lineTo(rL, rT + bR);
        ictx.arcTo(rL, rT, rL + bR, rT, bR);
        ictx.closePath();
        // ティールグラデーション
        var grad = ictx.createLinearGradient(rL, rT, rL + rW, rT + rH);
        grad.addColorStop(0, '#2E7D7A');
        grad.addColorStop(1, '#1F5957');
        ictx.fillStyle = grad;
        ictx.fill();

        // 縁取りグロー
        var glowAlpha = 0.5 * (1 - t);
        ictx.strokeStyle = accentRGBA(glowAlpha);
        ictx.lineWidth = 2;
        ictx.stroke();

        if(t < 1){
          // 内側に向かって黒い領域がしぼむマスク
          var margin = t * Math.max(vw, vh);
          ictx.save();
          ictx.beginPath();
          ictx.rect(0, 0, vw, vh);
          var eL = rL - margin, eT = rT - margin, eW = rW + margin*2, eH = rH + margin*2, eR = bR + margin;
          ictx.moveTo(eL + eR, eT);
          ictx.lineTo(eL + eW - eR, eT);
          ictx.arcTo(eL + eW, eT, eL + eW, eT + eR, eR);
          ictx.lineTo(eL + eW, eT + eH - eR);
          ictx.arcTo(eL + eW, eT + eH, eL + eW - eR, eT + eH, eR);
          ictx.lineTo(eL + eR, eT + eH);
          ictx.arcTo(eL, eT + eH, eL, eT + eH - eR, eR);
          ictx.lineTo(eL, eT + eR);
          ictx.arcTo(eL, eT, eL + eR, eT, eR);
          ictx.closePath();
          ictx.clip('evenodd');
          ictx.fillStyle = '#000000';
          ictx.fillRect(0, 0, vw, vh);
          ictx.restore();
        }

        if(t >= 1){
          // 終了: 本物のページにシームレスに切り替え
          document.documentElement.classList.add('bg-ready');
          document.body.classList.add('bg-ready');
          wrap.classList.add('bg-ready');
          wrap.style.opacity = '1';

          introCanvas.style.transition = 'opacity 0.4s';
          introCanvas.style.opacity = '0';
          setTimeout(function(){
            introCanvas.style.display = 'none';
            startTime = null;
            requestAnimationFrame(animate);
          }, 400);
        } else {
          requestAnimationFrame(introAnimate);
        }
      }
    }

    setTimeout(function(){ requestAnimationFrame(introAnimate); }, 200);
  }

  // === ロゴ画像スライドイン ===
  function animate(ts){
    if(!startTime) startTime = ts;
    var elapsed = ts - startTime;

    if(phase === 'slide'){
      var t = elapsed / slideDur;
      if(t > 1) t = 1;

      logoImg.style.visibility = 'visible';
      canvas.style.display = 'none';

      // バウンドして中央に着地
      var tx;
      if(t < 0.5){
        var p = t / 0.5;
        var ease = 1 - Math.pow(1 - p, 3);
        tx = -300 + (300 - 35) * ease;
      } else if(t < 0.75){
        var p = (t - 0.5) / 0.25;
        var ease = 1 - Math.pow(1 - p, 2);
        tx = -35 + (-55 - (-35)) * ease;
      } else {
        var p = (t - 0.75) / 0.25;
        var ease = 1 - Math.pow(1 - p, 2);
        tx = -55 + (-50 - (-55)) * ease;
      }

      var sc = 1;
      if(t >= 0.4 && t < 0.6){
        var bp = (t - 0.4) / 0.2;
        sc = 1 + 0.03 * Math.sin(bp * Math.PI);
      }

      logoImg.style.transform = 'translateX(' + tx + '%) scale(' + sc + ')';

      if(t >= 1){
        phase = 'done';
        logoImg.style.transform = 'translateX(-50%) scale(1)';

        wrap.addEventListener('click', function(){ location.reload(); });

        document.getElementById('title').classList.add('show');
        document.getElementById('subtitle').classList.add('show');
        document.getElementById('btnArea').classList.add('show');
        document.getElementById('scrollHint').classList.add('show');
      }
      requestAnimationFrame(animate);
    }
  }
})();

(function(){
  var url = location.protocol === 'file:'
    ? 'https://takahirohayashi358244.github.io/Gworker-HFO1/'
    : location.href.replace(/\/$/,'').split('#')[0].split('?')[0];

    new QRious({
      element: document.getElementById('qrCanvas'),
      value: url,
      size: 220,
      backgroundAlpha: 1,
      foreground: '#0F2A47',
      background: '#FFFFFF',
      level: 'M'
    });
  };
  document.head.appendChild(s);
})();

// ============================================================
//  ユーティリティ
// ============================================================
function scrollToQR() {
  document.getElementById('qrSection').scrollIntoView({ behavior: 'smooth' });
}

function copyUrl() {
  var url = document.getElementById('urlBox').textContent;
  var btn = document.getElementById('copyBtn');
  var copyText = document.getElementById('copyText');
  var copyIco = document.getElementById('copyIco');

  var done = function() {
    btn.classList.add('copied');
    copyIco.textContent = '✓';
    copyText.textContent = 'コピーしました';
    setTimeout(function() {
      btn.classList.remove('copied');
      copyIco.textContent = '📋';
      copyText.textContent = 'URLをコピー';
    }, 2000);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(function() {
      legacyCopy(url, done);
    });
  } else {
    legacyCopy(url, done);
  }
}

function legacyCopy(text, callback) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    callback();
  } catch(e) {
    alert('コピーに失敗しました');
  }
  document.body.removeChild(ta);
}
